[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-research-agent-backend"
version = "0.1.0"
description = "FastAPI backend for an evidence-grounded Indian stock research agent."
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "Stock Research Agent Team" }
]
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "tenacity>=9.1,<10.0",
  "openai>=1.100,<3.0",
  "groq>=0.30,<1.0",
  "huggingface-hub>=0.34,<2.0",
  "pandas>=2.3,<3.0",
  "numpy>=2.2,<3.0",
  "ta>=0.11,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "apscheduler>=3.11,<4.0",
  "structlog>=25.4,<26.0",
  "sentry-sdk[fastapi]>=2.35,<3.0",
  "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=6.2,<7.0",
  "respx>=0.22,<1.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "--disable-warnings",
  "-ra",
]
markers = [
  "integration: tests that use multiple application layers",
  "eval: model or agent evaluation tests",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
  "S",
]
ignore = [
  "S101", # Allow assert statements in tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
  "pandas.*",
  "ta.*",
]
ignore_missing_imports = true   